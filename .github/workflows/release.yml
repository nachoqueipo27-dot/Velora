# Genera los instaladores de Windows (.exe NSIS) y macOS (.dmg universal: Intel + Apple Silicon)
# y los adjunta a un Release en borrador de GitHub.
# Se dispara al pushear un tag vX.Y.Z (ver "npm run release") o a mano desde la pestaña Actions.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # El código es privado: los instaladores se publican en el repo PÚBLICO
          # velora-actualizaciones (solo Releases), que es de donde descarga el actualizador.
          # RELEASES_TOKEN: token con escritura solo sobre ese repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Firma de las actualizaciones (ver plugins.updater.pubkey en tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: nachoqueipo27-dot
          repo: velora-actualizaciones
          # El tag se crea en velora-actualizaciones; el commit de Velora no existe allá.
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: 'Velora v__VERSION__'
          releaseBody: |
            Instaladores de Velora v__VERSION__.

            - Windows: `Velora_..._x64-setup.exe`
            - macOS (Intel y Apple Silicon): `Velora_..._universal.dmg`

            La app de macOS no está firmada: la primera vez abrila con clic derecho → Abrir.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Sube latest.json al Release: es lo que consulta el actualizador de la app.
          includeUpdaterJson: true
