<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Usuarios y permisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#EFEDE8}
input[type=checkbox]{accent-color:#1A1915;width:18px;height:18px;margin:0}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #EFEDE8; font-family: 'Geist', system-ui, sans-serif; color: #1A1915">
  <dc-import name="Sidebar" active="Configuración" hint-size="240px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 20px 20px 20px 4px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 8px 4px 0">
      <div>
        <div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #6E6A62">CONFIGURACIÓN</div>
        <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Usuarios y permisos</h1>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1915; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500">Nuevo usuario</button>
    </header>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section style="flex: 1 1 320px; min-width: 0; max-width: 400px; background: #FFFFFF; border: 1px solid #E3E0D9; border-radius: 16px; overflow: hidden">
        <sc-for list="{{users}}" as="u" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #F1EEE9; background: {{u.bg}}">
            <span style="width: 36px; height: 36px; border-radius: 50%; background: #F2EFEA; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #3D3A34">{{u.ini}}</span>
            <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 500">{{u.n}}</span><span style="display: block; font-size: 12px; color: #6B6860; margin-top: 2px">{{u.r}}</span></span>
          </div>
        </sc-for>
      </section>
      <section style="flex: 999 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E0D9; border-radius: 16px; padding: 6px 20px 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 0 6px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Permisos de Martín Vega · Cajero</h2><span style="font-size: 12px; color: #6B6860">Entra con DNI y PIN de 4 dígitos</span></div>
        <sc-for list="{{perms}}" as="p" hint-placeholder-count="6">
          <div style="padding: 14px 0; border-top: 1px solid #F1EEE9; display: flex; flex-direction: column; gap: 10px">
            <label style="display: flex; gap: 12px; align-items: center; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{p.on}}"><span style="font-weight: 500">{{p.t}}</span></label>
            <div style="display: flex; gap: 8px; align-items: flex-start; background: #F7F5F1; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; color: #4A4740; margin-left: 30px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg>
              <span>{{p.h}}</span>
            </div>
          </div>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const u = (n, ini, r, sel) => ({ n, ini, r, bg: sel ? '#FBFAF7' : '#FFFFFF' });
    return {
      users: [u('Lucía Romero', 'LR', 'Administradora'), u('Martín Vega', 'MV', 'Cajero', true), u('Matías Ruiz', 'MR', 'Técnico'), u('Sofía Luna', 'SL', 'Técnica')],
      perms: [
        { t: 'Cobrar en el punto de venta', on: true, h: 'Puede escanear, armar ventas y cobrar. Es lo mínimo para atender el mostrador.' },
        { t: 'Hacer descuentos', on: false, h: 'Si está apagado, para aplicar un descuento le pide el PIN a un administrador. Evita descuentos sin control.' },
        { t: 'Anular ventas y hacer devoluciones', on: false, h: 'Devolver plata o anular una venta mueve la caja. Si está apagado, necesita la autorización de un administrador.' },
        { t: 'Ver la caja y cerrarla', on: true, h: 'Puede ver los cobros del día y hacer el cierre. No puede borrar movimientos ya registrados.' },
        { t: 'Cambiar precios y costos', on: false, h: 'Incluye la actualización masiva por porcentaje. Cada cambio queda registrado con su nombre en el historial de actividad.' },
        { t: 'Ver Finanzas y reportes', on: false, h: 'Muestra ganancias, márgenes y saldos de cuentas. Suele quedar solo para el dueño o el encargado.' }
      ]
    };
  }
}
</script>
</body>
</html>
