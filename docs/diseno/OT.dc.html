<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Órdenes de trabajo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#EFEDE8}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #EFEDE8; font-family: 'Geist', system-ui, sans-serif; color: #1A1915">
  <dc-import name="Sidebar" active="Órdenes de trabajo" hint-size="240px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 20px 20px 20px 4px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 8px 4px 0">
      <div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Órdenes de trabajo</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #6B6860">6 abiertas · 1 para entregar hoy · 3 garantías activas</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <div role="tablist" aria-label="Vista" style="display: flex; gap: 4px; background: #E3E0D9; border-radius: 12px; padding: 4px">
          <button type="button" role="tab" aria-selected="true" style="height: 32px; padding: 0 14px; border: 1px solid #DDD9D1; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #1A1915">Tablero</button>
          <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; color: #4A4740">Lista</button>
        </div>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1915; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500">Nueva orden</button>
      </div>
    </header>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
        <section style="background: #E6E3DC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 640px">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px">
            <h2 style="margin: 0; font-size: 14px; font-weight: 600">{{col.t}}</h2>
            <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #5F5B53">{{col.n}}</span>
          </div>
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
            <article style="background: #FFFFFF; border: 1px solid #E3E0D9; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6E6A62">OT #{{c.num}}</span><span style="font-size: 11px; font-weight: 500; color: {{c.dueC}}">{{c.due}}</span></div>
              <div style="font-size: 14px; font-weight: 500; line-height: 1.35">{{c.t}}</div>
              <div style="font-size: 12px; color: #6B6860">{{c.client}}</div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px">
                <span style="font-size: 11px; color: #3D3A34; background: #F2EFEA; border-radius: 999px; padding: 3px 9px">{{c.tag}}</span>
                <span style="width: 24px; height: 24px; border-radius: 50%; background: #F2EFEA; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #3D3A34">{{c.who}}</span>
              </div>
            </article>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (num, t, client, due, tag, who, late) => ({ num, t, client, due, tag, who, dueC: late ? '#9E1F3C' : '#55524B' });
    return {
      cols: [
        { t: 'Pendiente', n: '3', cards: [
          c('0091', 'Cambio de pantalla notebook 15"', 'Julián Ferreyra', 'Vence 28/11', 'Reparación', 'MR'),
          c('0090', 'Instalación de cámaras (4)', 'Escuela N.º 14', 'Vence 02/12', 'Instalación', 'LS') ] },
        { t: 'En curso', n: '2', cards: [
          c('0088', 'Service completo de compresor', 'Taller Rodríguez', 'Hoy', 'Mantenimiento', 'MR', true),
          c('0087', 'Reparación de impresora térmica', 'Lorena Paz', 'Mañana', 'Reparación', 'LS') ] },
        { t: 'Esperando repuesto', n: '1', cards: [
          c('0084', 'Cambio de placa madre', 'Carla Benítez', 'Atrasada 2 días', 'Reparación', 'MR', true) ] },
        { t: 'Lista para entregar', n: '1', cards: [
          c('0082', 'Armado de PC de oficina', 'Marta Giménez', 'Avisado por WhatsApp', 'Armado', 'LS') ] }
      ]
    };
  }
}
</script>
</body>
</html>
